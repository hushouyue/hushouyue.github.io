cv:
  name: Shouyue (Bruce) Hu
  label: Robotics MSE student, Johns Hopkins University
  email: bruce.shouyue.hu@gmail.com
  location: Baltimore, MD
  image: ""
  summary: "I design models that describe physical phenomena and predict what happens next. My work focuses on GPU physics simulation of soft tissue and surgical tools for tissue manipulation, cutting, needle insertion and suturing. These simulations let a surgical robot anticipate how tissue will respond before it acts, generate synthetic data for training learning-based models, and serve as a testbed for medical devices and for evaluating surgical robot autonomy."

